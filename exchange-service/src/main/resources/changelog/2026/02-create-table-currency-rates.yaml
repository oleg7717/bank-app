databaseChangeLog:
  - changeSet:
      id: 1
      author: o.goncharenko
      changes:
        - createTable:
            tableName: currency_rates
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: from_currency
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: to_currency
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: rate
                  type: DOUBLE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false