spring:
  application:
    name: account-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/postgres?currentSchema=account
    username: postgres
    password: password
  liquibase:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=account
    user: postgres
    password: password
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: account
    liquibase-schema: public
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
#  sql:
#    init:
#      mode: always
#      data-locations: classpath:data.sql
#      continue-on-error: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/master

application:
  service:
    notification:
      url: http://localhost:8084

server:
  port: 8081