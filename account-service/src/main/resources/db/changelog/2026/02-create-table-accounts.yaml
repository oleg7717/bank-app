databaseChangeLog:
- changeSet:
    id: 2
    author: o.goncharenko
    changes:
      - createTable:
          tableName: accounts
          schemaName: account
          columns:
            - column:
                name: id
                type: bigserial
                constraints:
                  primaryKey: true
                  nullable: false
            - column:
                name: login
                type: varchar(50)
                constraints:
                  nullable: false
                  unique: true
            - column:
                name: firstname
                type: varchar(50)
                constraints:
                  nullable: false
            - column:
                name: surname
                type: varchar(50)
                constraints:
                  nullable: false
            - column:
                name: birthdate
                type: date
                constraints:
                  nullable: false
            - column:
                name: balance
                type: double precision
                constraints:
                  nullable: false

      - sql:
          sql: ALTER TABLE account.accounts ADD CONSTRAINT balance_non_negative CHECK (balance >= 0)

    rollback:
      - dropTable:
          tableName: accounts
          schemaName: account