databaseChangeLog:
  - changeSet:
      id: create-table-accounts
      author: o.goncharenko
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(10)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: main
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: decimal(19,2)
                  constraints:
                    nullable: true
              - column:
                  name: currency
                  type: varchar(3)
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            constraintName: fk_accounts_client
            baseTableName: accounts
            baseColumnNames: client_id
            referencedTableName: clients
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: RESTRICT

  - changeSet:
      id: add-indexes-accounts
      author: o.goncharenko
      changes:
        - createIndex:
            indexName: idx_accounts_client_id
            tableName: accounts
            columns:
              - column:
                  name: client_id
        - createIndex:
            indexName: idx_accounts_status
            tableName: accounts
            columns:
              - column:
                  name: status