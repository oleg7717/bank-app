spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://keycloak:8090/realms/master # Адрес сервера авторизации для получения токена
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8090/realms/master
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

application:
  service:
    account:
      url: http://account-service
    notification:
      communication-method: kafka

management:
  health:
    discovery:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info