{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "bank-chart.fullname" . }}-gateway
  labels:
    {{- include "bank-chart.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
  {{- toYaml .Values.gateway.listeners | nindent 2 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bank-chart.fullname" . }}-routes
  labels:
    {{- include "bank-chart.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ include "bank-chart.fullname" . }}-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /account-service
    backendRefs:
    - name: account-service
      port: {{ .Values.services.account.port }}
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-Prefix
          value: /account-service
  - matches:
    - path:
        type: PathPrefix
        value: /cash-service
    backendRefs:
    - name: cash-service
      port: {{ .Values.services.cash.port }}
  - matches:
    - path:
        type: PathPrefix
        value: /transfer-service
    backendRefs:
    - name: transfer-service
      port: {{ .Values.services.transfer.port }}
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: bank-front
      port: {{ .Values.services.front.port }}
{{- end }}