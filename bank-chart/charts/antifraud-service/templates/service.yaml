apiVersion: v1
kind: Service
metadata:
  name: antifraud-service
  labels:
    app: antifraud-service
    {{- include "antifraud-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: antifraud-service
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}