scrape_configs:
  - job_name: 'bank-front'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['bank-front:8080']
        labels:
          application: 'bank-front'
  - job_name: 'account-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['account-service:8081']
        labels:
          application: 'account-service'
  - job_name: 'cash-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['cash-service:8082']
        labels:
          application: 'cash-service'
  - job_name: 'transfer-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['transfer-service:8083']
        labels:
          application: 'transfer-service'
  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['notification-service':8084']
        labels:
          application: 'notification-service'
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['gateway:9080']
        labels:
          application: 'gateway'